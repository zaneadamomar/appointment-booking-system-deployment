services:

  sqlserver:
    build:
      context: ./database
      dockerfile: Dockerfile

    container_name: appointmentbookings-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - appointment-network


  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: appointmentbookings-api
    restart: unless-stopped

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;
        Database=AppointmentBookings;
        User Id=sa;
        Password=${SA_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=False;

    ports:
      - "8080:8080"

    networks:
      - appointment-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080

    container_name: appointmentbookings-frontend
    restart: unless-stopped

    depends_on:
      - api

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    ports:
      - "3000:3000"

    networks:
      - appointment-network


networks:
  appointment-network:
    driver: bridge


volumes:
  sqlserver_data: