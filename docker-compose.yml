services:

  # ==========================================================
  # SQL SERVER
  # ==========================================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: appointmentbookings-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - appointment-network


  # ==========================================================
  # DATABASE INITIALISATION
  # ==========================================================

  database-init:
    image: mcr.microsoft.com/mssql-tools18:latest
    container_name: appointmentbookings-db-init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      SQL_PASSWORD: "${SA_PASSWORD}"

    volumes:
      - ./database:/scripts:ro

    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "=========================================="
        echo " Appointment Booking Database Setup"
        echo "=========================================="

        echo "Checking SQL Server..."

        until /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$SQL_PASSWORD" \
          -C \
          -Q "SELECT 1" > /dev/null 2>&1
        do
          echo "SQL Server is not ready yet..."
          sleep 2
        done

        echo "SQL Server is ready."

        echo "Checking AppointmentBookings database..."

        DB_EXISTS=$$(/opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$SQL_PASSWORD" \
          -C \
          -h -1 \
          -W \
          -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = 'AppointmentBookings'")

        if [ "$$DB_EXISTS" = "1" ]; then

          echo "AppointmentBookings already exists."
          echo "Skipping database creation."

        else

          echo "Creating AppointmentBookings database..."

          /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver \
            -U sa \
            -P "$$SQL_PASSWORD" \
            -C \
            -Q "CREATE DATABASE AppointmentBookings"

          echo "Database created."

          echo "Running database initialization script..."

          /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver \
            -U sa \
            -P "$$SQL_PASSWORD" \
            -C \
            -d AppointmentBookings \
            -i /scripts/init.sql

          echo "Database initialization completed."

        fi

        echo "=========================================="
        echo " Database setup complete"
        echo "=========================================="

    networks:
      - appointment-network


  # ==========================================================
  # .NET API
  # ==========================================================

  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: appointmentbookings-api
    restart: unless-stopped

    depends_on:
      database-init:
        condition: service_completed_successfully

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;
        Database=AppointmentBookings;
        User Id=sa;
        Password=${SA_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=False;

    ports:
      - "8080:8080"

    networks:
      - appointment-network


  # ==========================================================
  # NEXT.JS FRONTEND
  # ==========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080

    container_name: appointmentbookings-frontend
    restart: unless-stopped

    depends_on:
      - api

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    ports:
      - "3000:3000"

    networks:
      - appointment-network


# ============================================================
# NETWORK
# ============================================================

networks:
  appointment-network:
    driver: bridge


# ============================================================
# PERSISTENT SQL SERVER STORAGE
# ============================================================

volumes:
  sqlserver_data: